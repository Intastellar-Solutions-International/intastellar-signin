<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intastellar Accounts Login API test</title>
    <script src="./login.js"></script>
    <link rel="stylesheet" href="../style.css">
</head>

<body class="grid content">
    <header>
        <h1>Intastellar Accounts Login API test</h1>
    </header>
    <div id="buttonDiv"
        data-client_id="d2eefd7f1564fa4c9714000456183a6b0f51e8c9519e1089ec41ce905ffc0c453dfac91ae8645c41ebae9c59e7a6e5233b1339e41a15723a9ba6d934bbb3e92d"
        data-app-name="Example App" data-theme="dark" data-login_callback="logUserIn"></div>
    <div class="profile">
        <img id="profileImage" src="https://scontent-uc-d2c-7.intastellar.com/a/s/ul/p/avtr46-img/profile_standard.jpg"
            alt="Profile Image">
        <div id="user">
            <p>This is you Intastellar Account</p>
            <div id="user-info"></div>
        </div>
    </div>
    <script>

        Intastellar.accounts.id.renderButton("buttonDiv",
            {
                'theme': 'dark',
                'scopes': ['phone', 'birthday', "design"],
                'picker': 'popup',
            }
        )

        function logUserIn(token) {
            document.querySelector("#profileImage").src = "";
            document.querySelector("#user-info").innerHTML = "";
            localStorage.setItem("user", JSON.stringify(token));
            document.querySelector("#profileImage").src = token.user.avatar;
            document.querySelector("#user-info").innerHTML += "<h1>Welcome " + token.user.name.firstName + "</h1>";
            document.querySelector("#user-info").innerHTML += "<p>Your phone: " + token.user?.phone + "</p>";
            document.querySelector("#user-info").innerHTML += "<p>Your email: " + token.user.email + "</p>";
            document.querySelector("#user-info").innerHTML += "<p>Your birthday: " + token.user?.birthday + "</p>";
        }

        function signout() {
            Intastellar.accounts.id.logout();
            localStorage.removeItem("user");
        }

        if (localStorage.getItem("user")) {
            document.querySelector("#profileImage").src = JSON.parse(localStorage.getItem("user")).user.avatar;
            document.querySelector("#user-info").innerHTML += "<h1>Welcome " + JSON.parse(localStorage.getItem("user")).user.name.firstName + "</h1>";
            document.querySelector("#user-info").innerHTML += "<p>Your phone: " + JSON.parse(localStorage.getItem("user")).user?.phone + "</p>";
            document.querySelector("#user-info").innerHTML += "<p>Your email: " + JSON.parse(localStorage.getItem("user")).user.email + "</p>";
            document.querySelector("#user-info").innerHTML += "<p>Your birthday: " + JSON.parse(localStorage.getItem("user")).user?.birthday + "</p>";
            document.querySelector("#user-info").innerHTML += "<button onClick='signout()'>Logout</button>";
        }
    </script>
</body>

</html>
